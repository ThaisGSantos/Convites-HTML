<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convites</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 18px;
 background:radial-gradient(circle at 50% 18%,#3d194e,#100619 72%);
 font-family:'EB Garamond',Georgia,serif;color:#f6ecd8}
a{color:#f3c65a}
.wrap{width:100%;max-width:460px;text-align:center}
.orn{color:#e0b455;letter-spacing:.5em;font-size:12px}
h1{margin:14px 0 4px;font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(44px,12vw,68px);line-height:1.4;
 background:linear-gradient(180deg,#fbe6a4,#f3c65a 45%,#b8862b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p.sub{margin:0 0 26px;font-family:'Cinzel',Georgia,serif;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#d9b46a}
.card{display:block;padding:22px 20px;margin-bottom:12px;text-decoration:none;
 border:1px solid rgba(243,198,90,.4);border-radius:12px;
 background:linear-gradient(180deg,rgba(61,25,78,.7),rgba(23,9,33,.8));transition:border-color .3s}
.card:hover{border-color:rgba(243,198,90,.85)}
.card b{display:block;font-family:'Cinzel',Georgia,serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#f3c65a}
.card span{display:block;margin-top:6px;font-size:17px;color:#e7d3b4}
</style>
</head>
<body>
<div class="wrap">
  <div class="orn">◆ ─────── ◆ ─────── ◆</div>
  <h1>Convites</h1>
  <p class="sub">Nossos eventos</p>
  <a class="card" href="vitoria-15-anos/"><b>Vitoria — 15 anos</b><span>20 de março de 2027 · Espaço Carrier</span></a>
  <div class="orn" style="margin-top:18px">◆ ─────── ◆ ─────── ◆</div>
</div>
</body>
</html>
