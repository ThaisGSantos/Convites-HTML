<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vitoria 15 Anos — Envelope Etapa 2 Exato</title>
<style>
*{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  background:#100619;
}
html,body{
  margin:0;min-height:100%;background:#100619;
  overscroll-behavior-y:none;
}
body{
  font-family:Georgia,'Times New Roman',serif;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.scene{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:
    max(18px,env(safe-area-inset-top))
    max(18px,env(safe-area-inset-right))
    max(18px,env(safe-area-inset-bottom))
    max(18px,env(safe-area-inset-left));
  background:radial-gradient(circle at 50% 25%,#351549,#100619 72%);
}

/* EXACT approved envelope image */
.cover{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding:
    max(18px,env(safe-area-inset-top))
    max(18px,env(safe-area-inset-right))
    max(18px,env(safe-area-inset-bottom))
    max(18px,env(safe-area-inset-left));
  background:radial-gradient(circle at 50% 28%,#3d194e,#100619 72%);
  transition:opacity .8s ease,visibility .8s ease;
  overflow:hidden;
}
.cover.open{opacity:0;visibility:hidden;pointer-events:none}
.envelope-exact{
  position:relative;width:min(98vw,980px,(100svh - 40px) * 988 / 630);cursor:pointer;
  transition:transform .65s cubic-bezier(.2,.75,.25,1),filter .65s ease,opacity .65s ease;
  filter:drop-shadow(0 28px 58px rgba(0,0,0,.58));
}
.envelope-exact img{display:block;width:100%;height:auto;border-radius:10px}
.envelope-exact.clicked{
  transform:translateY(-8px) scale(1.025);
  filter:drop-shadow(0 34px 70px rgba(0,0,0,.62)) drop-shadow(0 0 18px rgba(223,175,69,.18));
  opacity:.18;
}

/* Approved invitation stays intact */
.invite{
  position:relative;width:min(94vw,620px);aspect-ratio:1024/1536;
  opacity:0;transform:translateY(16px) scale(.99);
  transition:opacity 1s ease,transform 1s ease;
  overflow:hidden;border-radius:18px;box-shadow:0 30px 90px #0009
}
.invite.revealed{opacity:1;transform:none}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}

/* Independent interactive-looking lantern layer */
.lantern-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.lantern{position:absolute;bottom:-18%;height:auto;opacity:0;filter:drop-shadow(0 0 10px rgba(255,174,54,.45));animation:rise var(--dur) linear var(--delay) infinite,sway var(--sway) ease-in-out var(--delay) infinite alternate}
@keyframes rise{0%{bottom:-18%;opacity:0}8%{opacity:var(--alpha)}82%{opacity:var(--alpha)}100%{bottom:108%;opacity:0}}
@keyframes sway{from{margin-left:-9px;transform:rotate(-2deg)}to{margin-left:11px;transform:rotate(2deg)}}
.l1{left:8%;width:8.5%;--dur:16s;--delay:1s;--sway:4s;--alpha:.88}
.l2{left:25%;width:5.2%;--dur:20s;--delay:4s;--sway:5s;--alpha:.62}
.l3{left:44%;width:6.5%;--dur:18s;--delay:7s;--sway:4.2s;--alpha:.75}
.l4{left:66%;width:4.8%;--dur:22s;--delay:3s;--sway:5.4s;--alpha:.56}
.l5{left:82%;width:8%;--dur:17s;--delay:9s;--sway:3.7s;--alpha:.86}
.l6{left:36%;width:4%;--dur:24s;--delay:12s;--sway:6s;--alpha:.5}
.l7{left:58%;width:4.5%;--dur:21s;--delay:14s;--sway:5.1s;--alpha:.55}

/* Stage 4 hotspots preserved */
.hotspot{
  position:absolute;z-index:8;bottom:5.5%;height:12%;
  background:transparent;border:0;cursor:pointer;
  min-height:44px;min-width:44px;
  touch-action:manipulation;
}
.rsvp{left:17.5%;width:20.5%}
.map{left:39.7%;width:20.5%}
.gifts{left:61.9%;width:20.5%}
.hotspot:focus-visible{outline:none}

@media(max-width:650px){
  .scene{
    padding:0;
    min-height:100dvh;
    align-items:start;
  }
  .invite{
    width:100vw;
    max-width:none;
    border-radius:0;
    box-shadow:none;
    aspect-ratio:1024/1536;
  }
  .cover{
    padding:
      max(8px,env(safe-area-inset-top))
      0
      max(8px,env(safe-area-inset-bottom))
      0;
  }
  .envelope-exact{
    width:min(100vw,980px,(100svh - 16px) * 988 / 630);
    max-width:100vw;
  }

  /* Slightly larger tappable zones on phones */
  .hotspot{
    bottom:5%;
    height:12.8%;
  }
  .rsvp{left:15.8%;width:22.5%}
  .map{left:38.8%;width:22.5%}
  .gifts{left:61.8%;width:22.5%}

  /* Keep depth but reduce simultaneous motion load on small screens */
  .l2,.l4,.l6{opacity:.94}
}

@media(max-width:390px){
  .hotspot{bottom:4.6%;height:13.4%}
  .rsvp{left:15.2%;width:23%}
  .map{left:38.5%;width:23%}
  .gifts{left:61.8%;width:23%}
}

@media(hover:hover){
  .hotspot:hover{outline:none;background:transparent}
}

/* Acesso discreto ao painel dos pais (protegido por senha) */
.parents-link{
  position:fixed;
  right:max(10px,env(safe-area-inset-right));
  bottom:max(10px,env(safe-area-inset-bottom));
  z-index:30;
  display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;
  color:rgba(243,198,90,.34);
  font-size:14px;text-decoration:none;
  transition:color .3s ease;
}
.parents-link:hover{color:rgba(243,198,90,.9)}

/* Trilha sonora */
.music-toggle{
  position:fixed;
  left:max(10px,env(safe-area-inset-left));
  bottom:max(10px,env(safe-area-inset-bottom));
  z-index:30;
  display:flex;align-items:center;justify-content:center;
  width:46px;height:46px;
  border:1px solid rgba(243,198,90,.45);
  border-radius:999px;
  background:rgba(23,9,33,.6);
  color:rgba(243,198,90,.8);
  font:16px/1 Georgia,serif;
  cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:color .3s ease,border-color .3s ease,opacity .5s ease;
}
.music-toggle:hover{color:#f3c65a;border-color:rgba(243,198,90,.85)}
.music-toggle[data-off="1"]{color:rgba(201,169,216,.5)}
.music-toggle[hidden]{display:none}

@media(prefers-reduced-motion:reduce){
  .envelope-exact,
  .cover,
  .invite{transition-duration:.18s!important}
  .lantern{animation-duration:30s!important}
}

/* New Manual dos Convidados button — added outside the approved artwork */
.manual-button{
  position:absolute;
  z-index:10;
  left:50%;
  bottom:0.8%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  padding:10px 16px;
  border:1px solid rgba(243,198,90,.9);
  border-radius:999px;
  background:rgba(45,15,63,.92);
  color:#f3c65a;
  font:600 11px/1.1 Georgia,'Times New Roman',serif;
  letter-spacing:.07em;
  text-transform:uppercase;
  text-decoration:none;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(0,0,0,.34),0 0 10px rgba(243,198,90,.12);
}
.manual-button::before{
  content:"☰";
  font-size:15px;
  line-height:1;
}
.manual-button:focus-visible{
  outline:2px solid #f3c65a;
  outline-offset:3px;
}
@media(max-width:650px){
  .manual-button{
    bottom:.55%;
    min-height:42px;
    padding:9px 13px;
    font-size:10px;
  }
}
@media(hover:hover){
  .manual-button:hover{
    background:rgba(58,20,79,.97);
    box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 13px rgba(243,198,90,.2);
  }
}

</style>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#3d194e"/><text x="50" y="62" font-size="34" font-family="Georgia,serif" fill="#f3c65a" text-anchor="middle">V</text></svg></template>
</head>
<body>

<div class="cover" id="cover">
  <div class="envelope-exact" id="envelope" role="button" tabindex="0" aria-label="Abrir convite">
    <img src="assets/img-01.jpg" alt="Envelope roxo e dourado aprovado na Etapa 2">
  </div>
</div>

<main class="scene">
<section class="invite" id="invite">
  <img class="base" src="assets/convite-vitoria.png" alt="Convite de 15 anos da Vitoria">
  <div class="lantern-layer" aria-hidden="true">
    <img class="lantern l1" src="assets/img-03.svg"><img class="lantern l2" src="assets/img-04.svg">
    <img class="lantern l3" src="assets/img-05.svg"><img class="lantern l4" src="assets/img-06.svg">
    <img class="lantern l5" src="assets/img-07.svg"><img class="lantern l6" src="assets/img-08.svg">
    <img class="lantern l7" src="assets/img-09.svg">
  </div>
  <a class="hotspot rsvp" aria-label="Confirmar presença" href="confirmar.dc.html"></a>
  <a class="hotspot map" aria-label="Como chegar" href="https://maps.app.goo.gl/CS6RrVJNtquhHxTMA?g_st=aw" target="_blank" rel="noopener noreferrer"></a>
  <a class="hotspot gifts" aria-label="Lista de presentes" href="presentes.dc.html"></a>
  <a class="manual-button" aria-label="Manual dos convidados" href="manual.dc.html">Manual dos convidados</a>
</section>
</main>

<button class="music-toggle" id="musicToggle" type="button" aria-label="Ligar ou desligar a música" title="Música">♪</button>
<audio id="bgMusic" src="assets/musica.mp3" loop preload="auto"></audio>

<a class="parents-link" href="painel.dc.html" aria-label="Painel dos pais (senha)" title="Painel dos pais">◆</a>

<script>
const cover=document.getElementById('cover');
const env=document.getElementById('envelope');
const invite=document.getElementById('invite');
function openInvite(){
 if(env.classList.contains('clicked')) return;
 env.classList.add('clicked');
 setTimeout(()=>cover.classList.add('open'),620);
 setTimeout(()=>invite.classList.add('revealed'),690);
}
if(location.hash==='#convite'){
 env.classList.add('clicked');
 cover.classList.add('open');
 invite.classList.add('revealed');
}
/* Trilha sonora (arquivo local) */
const audio=document.getElementById('bgMusic');
const musicBtn=document.getElementById('musicToggle');
audio.volume=.55;
const MKEY='vitoria_music';
function mSave(on){try{localStorage.setItem(MKEY,JSON.stringify({time:audio.currentTime,on:on}));}catch(e){}}
try{const st=JSON.parse(localStorage.getItem(MKEY)||'{}');
 audio.addEventListener('loadedmetadata',()=>{const t=parseFloat(st.time);if(t>0&&t<audio.duration){try{audio.currentTime=t;}catch(e){}}});
}catch(e){}
audio.addEventListener('timeupdate',()=>{if(!audio.paused)mSave(true);});
function markState(){musicBtn.dataset.off=audio.paused?'1':'';musicBtn.textContent=audio.paused?'♪':'♫';}
function startMusic(){audio.play().then(markState).catch(markState);}
/* tenta tocar assim que a página abre; se o navegador bloquear,
   começa no primeiro toque em qualquer lugar */
audio.play().then(()=>{markState();}).catch(()=>{
 markState();
 const kick=()=>{startMusic();['pointerdown','touchstart','keydown','scroll'].forEach(ev=>document.removeEventListener(ev,kick));};
 ['pointerdown','touchstart','keydown','scroll'].forEach(ev=>document.addEventListener(ev,kick,{once:false,passive:true}));
});
musicBtn.addEventListener('click',()=>{audio.paused?startMusic():(audio.pause(),mSave(false),markState());});
audio.addEventListener('error',()=>{musicBtn.hidden=true;});
markState();
env.addEventListener('click',startMusic);
env.addEventListener('click',openInvite);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite();}});
</script>
</body>
</html>
